name: Daily simulator analytics refresh

on:
  schedule:
    # Refresh after the Worker's 05:23 UTC raw-payload cleanup has completed.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the daily data job; the publisher also retries other concurrent pushes.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh and publish simulator analytics
        run: bash scripts/refresh-simulator-analytics.sh
        env:
          # The repository variable can override this for staging or a future custom domain.
          GATCG_SIMULATOR_API_URL: ${{ vars.GATCG_SIMULATOR_API_URL || 'https://fanofin-match-ingestion-production.fanofin-match-ingestion-worker.workers.dev' }}
