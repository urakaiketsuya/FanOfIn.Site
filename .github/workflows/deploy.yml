name: Deploy to GitHub Pages
# Retried now that Pages source is set to "GitHub Actions" in repo settings.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "shared/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; let an in-flight deploy finish rather than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=app
        env:
          VITE_GOOGLE_CLIENT_ID: 33283325780-takrrvtrs2qb8pshdkukog52le87b76k.apps.googleusercontent.com
          VITE_ACCOUNT_API_URL: https://accounts.fanofin.site/api
          # Not secret — GA4 measurement IDs are visible in every page's outgoing requests. See
          # app/src/lib/analytics.ts (loads only in production builds, no-ops without this).
          VITE_GA_MEASUREMENT_ID: "G-R6Q0DXG947"

      - name: Copy published data into the build output
        # app/public/data is a symlink to ../../data for local dev — copy explicitly here instead
        # of relying on the checkout + Vite public-dir copy to preserve/follow it correctly in CI.
        run: |
          rm -rf app/dist/data
          cp -RL data app/dist/data

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
