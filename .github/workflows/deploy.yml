name: Deploy to GitHub Pages
# Retried now that Pages source is set to "GitHub Actions" in repo settings.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "shared/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight deploy finish rather than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=app
        env:
          VITE_GOOGLE_CLIENT_ID: 33283325780-takrrvtrs2qb8pshdkukog52le87b76k.apps.googleusercontent.com
          VITE_ACCOUNT_API_URL: https://accounts.fanofin.site/api

      - name: Copy published data into the build output
        # app/public/data is a symlink to ../../data for local dev — copy explicitly here instead
        # of relying on the checkout + Vite public-dir copy to preserve/follow it correctly in CI.
        run: |
          rm -rf app/dist/data
          cp -RL data app/dist/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
