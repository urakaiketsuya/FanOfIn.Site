name: Deploy to GitHub Pages
# Retried now that Pages source is set to "GitHub Actions" in repo settings.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "shared/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; let an in-flight deploy finish rather than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=app
        env:
          VITE_GOOGLE_CLIENT_ID: 33283325780-takrrvtrs2qb8pshdkukog52le87b76k.apps.googleusercontent.com
          VITE_ACCOUNT_API_URL: https://accounts.fanofin.site/api

      - name: Copy published data into the build output
        # app/public/data is a symlink to ../../data for local dev — copy explicitly here instead
        # of relying on the checkout + Vite public-dir copy to preserve/follow it correctly in CI.
        run: |
          rm -rf app/dist/data
          cp -RL data app/dist/data

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
