name: Security audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "*/package.json"
      - "account-worker/**"
      - "account-bff/**"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "*/package.json"
      - "account-worker/**"
      - "account-bff/**"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test --workspace=account-worker
      - run: npm run typecheck --workspace=account-worker
      - run: npm run typecheck --workspace=account-bff
