name: Account D1 restore drill

on:
  schedule:
    - cron: "41 7 15 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Backup release tag; leave blank to use the newest recovery point
        required: false

permissions:
  contents: read

concurrency:
  group: account-d1-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_REPOSITORY: ${{ secrets.ACCOUNT_BACKUP_REPOSITORY }}
      GH_TOKEN: ${{ secrets.ACCOUNT_BACKUP_REPOSITORY_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.ACCOUNT_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download and decrypt a recovery point
        id: recovery
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BACKUP_REPOSITORY"
          test -n "$GH_TOKEN"
          test -n "$BACKUP_PASSPHRASE"

          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            # Release createdAt can reflect the target commit rather than the
            # recovery-point time. Our UTC timestamp tags sort chronologically.
            tag="$(gh release list --repo "$BACKUP_REPOSITORY" --exclude-drafts --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | test("^account-d1-[0-9]{8}T[0-9]{6}Z$"))] | sort_by(.tagName) | (last // error("No account backup releases found")) | .tagName')"
          fi
          test -n "$tag"
          mkdir recovery
          gh release download "$tag" --repo "$BACKUP_REPOSITORY" --dir recovery --pattern '*.gpg*'
          cd recovery
          sha256sum --check ./*.sha256
          encrypted="$(find . -maxdepth 1 -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$encrypted"
          printf '%s\n' "$BACKUP_PASSPHRASE" | gpg --batch --yes --no-symkey-cache --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output backup.tar.gz "$encrypted"
          mkdir unpacked
          tar -C unpacked -xzf backup.tar.gz
          test -s unpacked/account-backup.sql
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore into a disposable D1 database and verify it
        working-directory: account-worker
        run: |
          set -euo pipefail
          restore_db="fanofin-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          created=false
          cleanup() {
            if [ "$created" = true ]; then
              npx wrangler d1 delete "$restore_db" --skip-confirmation
            fi
          }
          trap cleanup EXIT

          npx wrangler d1 create "$restore_db"
          created=true
          npx wrangler d1 execute "$restore_db" --remote --yes --file ../recovery/unpacked/account-backup.sql
          node ../scripts/account-restore-check.mjs > ../recovery/verify.sql
          # Generated queries expose only empty schema results and orphan counts.
          # Preserve diagnostics on failure instead of losing them with the runner.
          if ! npx wrangler d1 execute "$restore_db" --remote --json --command "$(cat ../recovery/verify.sql)" > ../recovery/verification.json; then
            cat ../recovery/verification.json
            exit 1
          fi
          if ! jq --argjson expected "$(wc -l < ../recovery/verify.sql)" -e 'length == $expected and all(.[]; .success == true) and ([.[].results[] | select(has("orphan_count"))] | length > 0 and all(.[]; .orphan_count == 0))' ../recovery/verification.json; then
            cat ../recovery/verification.json
            exit 1
          fi

      - name: Confirm disposable database cleanup
        if: always()
        working-directory: account-worker
        run: |
          set -euo pipefail
          restore_db="fanofin-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if npx wrangler d1 list --json | jq -e --arg name "$restore_db" '.[] | select(.name == $name)' > /dev/null; then
            npx wrangler d1 delete "$restore_db" --skip-confirmation
          fi

      - name: Record drill result
        run: |
          echo "### Account D1 restore drill passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery point: \`${{ steps.recovery.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: encrypted asset checksum, decryption, D1 import, all current migration-defined tables, views and columns, and every declared foreign-key relationship" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disposable D1 database deleted" >> "$GITHUB_STEP_SUMMARY"
