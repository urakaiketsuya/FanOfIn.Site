name: Daily data refresh

on:
  schedule:
    # 06:00 UTC daily — incremental, so a day with no new completed events is a fast no-op; this
    # just shortens how long a completed event (store championships included) waits to show up.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Don't let a slow run overlap with the next day's — later one waits instead of racing it.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Omnidex has no bulk-listing endpoint (see pipeline/src/omnidex/bounds.ts) — an incremental
    # scan plus per-event deep-fetches, each politely rate-limited, can run long.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow (depth 1) clone — the changelog page is
          # published straight from `git log`, which needs real history to read.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore pipeline fetch/similarity cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.cache
          # Always save a fresh entry (keyed by run id) and restore the most recent prior one —
          # this cache is genuinely incremental state (maxKnownId, per-event fetch cache, scored
          # similarity pairs), not a derived/reproducible build cache, so losing it would mean the
          # next run re-scans from scratch instead of just picking up what's new since last time.
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-

      - name: Check day of week
        id: day
        # PRICE_HISTORY_MAX_POINTS (shared/src/pricing.ts) assumes weekly snapshots for its ~1 year
        # lookback — keep pricing/price-history on that original cadence even though events/analysis
        # now run daily, rather than growing the file 7x or shrinking its real coverage to ~7 weeks.
        run: echo "is_monday=$([ "$(date -u +%u)" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (incremental)
        run: npm run pipeline
        env:
          GATCG_SKIP_PRICING: ${{ steps.day.outputs.is_monday == 'true' && '0' || '1' }}
          # Optional until the Worker is provisioned. When set as a repository variable, the
          # normal refresh publishes the simulator summary alongside tournament datasets.
          GATCG_SIMULATOR_API_URL: ${{ vars.GATCG_SIMULATOR_API_URL }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this run"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
