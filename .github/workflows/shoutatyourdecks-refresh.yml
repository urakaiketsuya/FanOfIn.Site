name: Monthly ShoutAtYourDecks refresh

on:
  schedule:
    # 1st of the month, 06:00 UTC — no time-sensitive event to wait on here (unlike the
    # Omnidex weekly refresh's weekend-tournament timing), just a steady monthly cadence.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

# Independent of the Omnidex `data-refresh` workflow — separate data source, separate concurrency
# group, so neither job waits on the other.
concurrency:
  group: shoutatyourdecks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # First full backfill took much longer than this — but that was ~21k decks from zero. A
    # monthly incremental run only touches decks new since last run: harvest always starts at page
    # 1 (the listing is newest-first) and stops once it hits a few consecutive pages with nothing
    # new, and metadata/decklists both skip anything already cached — see
    # pipeline/src/shoutatyourdecks/README.md — so it should stay well inside this budget. If a
    # run ever hits the timeout, that's not corrupting anything — every phase is resumable, so
    # next month's run just picks up wherever this one stopped.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # This source's first (and so far only) Playwright dependency — harvest.ts and
      # decklistFetch.ts both drive a real headless Chromium instance against
      # shoutatyourdecks.com, since it's a Blazor Server app with no JSON API (see the module
      # README's "Why this needs a browser at all").
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore ShoutAtYourDecks fetch cache
        uses: actions/cache@v4
        with:
          # Scoped to this source only, not the whole pipeline/.cache — keeps this cache
          # independent of the (much larger) Omnidex cache the weekly workflow manages, so
          # neither job's cache churn affects the other's restore/save time.
          path: pipeline/.cache/shoutatyourdecks
          key: pipeline-cache-syd-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-syd-

      - name: Harvest deck listing
        run: npm run pipeline:syd:harvest

      - name: Fetch deck metadata
        run: npm run pipeline:syd:metadata

      - name: Fetch decklists (filtered decks only)
        run: npm run pipeline:syd:decklists

      - name: Publish to data/
        run: npm run pipeline:syd:build

      - name: Rebuild analytics
        run: npm run pipeline:syd:analytics

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shoutatyourdecks
          if git diff --cached --quiet; then
            echo "No data changes this run"
            exit 0
          fi
          git commit -m "chore: monthly ShoutAtYourDecks refresh $(date -u +%Y-%m-%d)"

          # This repo sees other commits land on main during a run (this job alone can take tens of
          # minutes) — a plain push can get rejected as non-fast-forward. Retry with rebase; on a
          # conflict (only possible under data/shoutatyourdecks, the only path this job touches),
          # keep this run's freshly regenerated output — it's a full rebuild over the latest crawl
          # state, so it supersedes whatever generated snapshot the other commit happened to carry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — fetching and rebasing onto latest main"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours -- data/shoutatyourdecks
              git add data/shoutatyourdecks
              git rebase --continue
            fi
          done
          echo "::error::failed to push updated data after 5 attempts"
          exit 1
