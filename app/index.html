<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Archive TCG Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Counterpart to public/404.html's redirect — restores the real deep-linked path (encoded
      // as ?redirect=...) before React Router mounts, so a hard refresh or shared link works on
      // GitHub Pages despite it having no server-side rewrite support.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) history.replaceState(null, "", redirect);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
